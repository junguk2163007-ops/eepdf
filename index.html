  function metaTags(it, withDate, noNew) {

          '<span class="cat-rule"></span><span class="cat-name">' + esc(c) + '</span><span class="cat-count">' + pad(docs.length) + " DOCS</span></a>";
      }).join("") + "</div></section>";

    var recent = state.items.slice().sort(function (a, b) { return a.updated < b.updated ? 1 : a.updated > b.updated ? -1 : 0; }).slice(0, RECENT_MAX);
    if (recent.length) {
      html += '<section class="sec"><div class="sec-h"><h2>최근 추가</h2><a class="more" href="#all">전체 문서 ›</a></div><div class="rail">' +
        recent.map(function (it, i) {
          return '<a class="rc rise" style="--i:' + (i + 3) + '" href="' + esc(viewerHref(it)) + '">' +
            thumbSpan(it, "", true, isNew(it) ? '<span class="tag-new">NEW</span>' : "") +
            '<span class="rc-title">' + esc(it.title) + '</span><span class="rc-meta">' + esc(it.category) + " · " + fmtDate(it.updated).slice(5) + "</span></a>";
        }).join("") + "</div></section>";
    }
    return html;
  }

  /* 전체 문서: 분류에 들어가지 않고 한 번에 보기 */
  function allView() {
    var f = state.filter, counts = {};
    state.items.forEach(function (it) { counts[it.category] = (counts[it.category] || 0) + 1; });
    var chips = '<div class="chips" role="group" aria-label="분류 필터"><button class="chip" type="button" data-filter="" aria-pressed="' + (!f) + '">전체 <i>' + state.items.length + "</i></button>" +
      state.categories.map(function (c) {
        return '<button class="chip" type="button" data-filter="' + esc(c) + '" aria-pressed="' + (f === c) + '">' + esc(c) + " <i>" + (counts[c] || 0) + "</i></button>";
      }).join("") + "</div>";
    var html = tabsHtml("all") + chips + toolbar("분류별");
    var scope = f ? state.items.filter(function (it) { return it.category === f; }) : state.items;
    if (f || state.sort === "new" || state.categories.length < 2) {
      html += listHtml(sortItems(scope), "", !f);
    } else {
      state.categories.forEach(function (c) {
        var g = scope.filter(function (it) { return it.category === c; });
        if (g.length) html += '<div class="grp-h">' + esc(c) + "<span>" + pad(g.length) + "</span></div>" + listHtml(g, "", false);
      });
    }
    return html;
  }

  function categoryView(items) {
    var idx = state.categories.indexOf(state.cat) + 1;
    var latest = items.reduce(function (m, it) { return it.updated > m ? it.updated : m; }, "");
    var html = '<a class="crumb" href="#">' + BACK + "전체 분류</a>" +
      '<header class="cat-head"><span class="kicker">Category ' + pad(idx) + "</span><h2>" + esc(state.cat) + "</h2>" +
      "<p>" + pad(items.length) + " DOCS" + (latest ? " · UPDATED " + fmtDate(latest) : "") + "</p></header>" + toolbar("이름순");
    var loose = sortItems(items.filter(function (it) { return !it.sub; }));
    var subs = {}, order = [];
    items.forEach(function (it) { if (it.sub) { if (!subs[it.sub]) { subs[it.sub] = []; order.push(it.sub); } subs[it.sub].push(it); } });
    if (loose.length) html += listHtml(loose, "", false);
    var openAll = order.length === 1 && !loose.length;
    order.forEach(function (s) {
      html += '<details class="sub"' + (openAll ? " open" : "") + "><summary><span>" + esc(s) + "</span><em>" + pad(subs[s].length) +
        '</em><svg class="sub-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>' +
        listHtml(sortItems(subs[s]), "", false) + "</details>";
    });
    return html;
  }

  function render() {
    var q = norm(state.q.trim());
    var mode = q ? "search" : state.cat ? "category" : state.all ? "all" : "home";
    if (mode === "home" && state.categories.length < 2) mode = "all";
    document.body.classList.toggle("compact", mode !== "home");
    $("q").placeholder = state.cat ? state.cat + " 안에서 찾기" : "자료 이름으로 찾기";
    if (!state.items.length) {
      $("list").innerHTML = emptyHtml("아직 등록된 PDF가 없어요", "pdfs 폴더에 PDF를 올리면 여기에 나타납니다.");
      return;
    }
    var scope = state.cat ? state.items.filter(function (it) { return it.category === state.cat; }) : state.items;
    if (mode === "search") {
      var hits = scope.filter(function (it) {
        return norm(it.title).indexOf(q) >= 0 || norm(it.category).indexOf(q) >= 0 || norm(it.sub || "").indexOf(q) >= 0;
      });
      var head = '<header class="cat-head"><span class="kicker">Search</span><h2>검색 결과</h2><p>' + (state.cat ? esc(state.cat) + " · " : "") + pad(hits.length) + " DOCS</p></header>";
      $("list").innerHTML = hits.length
        ? head + toolbar("") + listHtml(hits, q, true)
        : emptyHtml("찾는 자료가 없어요", "다른 단어로 검색해 보세요." + (state.cat ? '<br><a class="crumb" href="#">전체 분류에서 찾기</a>' : ""));
    } else if (mode === "category") {
      $("list").innerHTML = scope.length ? categoryView(scope) : emptyHtml("이 분류에는 PDF가 없어요", '<a class="crumb" href="#">전체 분류로 돌아가기</a>');
    } else if (mode === "all") {
      $("list").innerHTML = allView();
    } else {
      $("list").innerHTML = homeView();
    }
    hydrateThumbs();
  }

  function syncHash() {
    var h = location.hash, m = h.match(/^#cat=(.+)$/), c = "";
    try { c = m ? decodeURIComponent(m[1]) : ""; } catch (e) {}
    state.cat = state.categories.indexOf(c) >= 0 ? c : "";
    state.all = h === "#all";
  }
  window.addEventListener("hashchange", function () { syncHash(); render(); window.scrollTo(0, 0); });

  $("list").addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-sort]"))) {
      state.sort = t.getAttribute("data-sort");
      try { localStorage.setItem("pdf-lib-sort", state.sort); } catch (err) {}
    } else if ((t = e.target.closest("[data-view]"))) {
      state.view = t.getAttribute("data-view");
      try { localStorage.setItem("pdf-lib-view", state.view); } catch (err) {}
    } else if ((t = e.target.closest("[data-filter]"))) {
      state.filter = t.getAttribute("data-filter");
    } else return;
    render();
  });
  $("q").addEventListener("input", function () {
    state.q = $("q").value;
    $("clear").hidden = !state.q;
    persist(); render();
  });
  $("clear").addEventListener("click", function () {
    $("q").value = ""; state.q = ""; $("clear").hidden = true;
    persist(); render(); $("q").focus();
  });
  $("q").value = state.q;
  $("clear").hidden = !state.q;

  // 제목을 누르면 어디서든(검색·분류·전체 문서) 첫 화면으로
  $("brand").addEventListener("click", function (e) {
    e.preventDefault();
    $("q").value = ""; state.q = ""; $("clear").hidden = true; state.filter = ""; persist();
    if (location.hash && location.hash !== "#") location.hash = "";  // hashchange에서 다시 그린다
    else { syncHash(); render(); window.scrollTo(0, 0); }
  });

  fetch("manifest.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (m) {
      state.items = m.items || [];
      state.categories = m.categories || [];
      state.generated = m.generated || "";
      syncHash();
      var pages = state.items.reduce(function (a, it) { return a + (it.pages || 0); }, 0);
      var latest = state.items.reduce(function (a, it) { return it.updated > a ? it.updated : a; }, "");
      $("ro-docs").textContent = state.items.length;
      $("ro-cats").textContent = state.categories.length;
      $("ro-pages").textContent = pages || "–";
      $("ro-date").textContent = latest ? latest.slice(5).replace("-", ".") : "–";
      $("foot-r").textContent = (state.generated ? "UPDATED " + fmtDate(state.generated) + " · " : "") + VERSION;
      render();
    })
    .catch(function () {
      $("list").innerHTML = emptyHtml("목록을 불러오지 못했어요", "manifest.json이 없거나 파일을 직접 열었을 수 있어요. 웹 주소로 접속했는지 확인해 주세요.");
    });
})();
</script>
</body>
</html>
