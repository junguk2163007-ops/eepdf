    var doc;
    return pdfjsLib.getDocument({ url: job.url, cMapUrl: "lib/cmaps/", cMapPacked: true, disableAutoFetch: true })
      .promise.then(function (d) { doc = d; return d.getPage(1); })
      .then(function (page) {
        var v1 = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: THUMB_W / v1.width });
        var c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
          var data = c.toDataURL("image/jpeg", 0.72);
          try { localStorage.setItem(job.key, data); } catch (e) {}
          showThumb(job.el, data);
        });
      })
      .then(function () { doc.destroy(); }, function (e) { if (doc) doc.destroy(); throw e; });
  }
  var thumbObserver = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      thumbObserver.unobserve(en.target);
      var el = en.target;
      thumbQueue.push({ el: el, url: el.getAttribute("data-url"), key: el.getAttribute("data-key") });
      pumpThumbs();
    });
  }, { rootMargin: "300px 0px" }) : null;

  function hydrateThumbs() {
    var els = document.querySelectorAll(".thumb[data-url]");
    for (var i = 0; i < els.length; i++) {
      var el = els[i], cached = null;
      try { cached = localStorage.getItem(el.getAttribute("data-key")); } catch (e) {}
      if (cached) showThumb(el, cached);
      else if (thumbObserver && window.pdfjsLib) thumbObserver.observe(el);
    }
  }

  /* ---------- 화면 조각 ---------- */
  function rowHtml(it, q, showCat) {
    var meta = [];
    if (isNew(it)) meta.push('<span class="tag-new">NEW</span>');
    if (showCat) meta.push('<span class="tag-cat">' + esc(it.category + (it.sub ? " · " + it.sub : "")) + "</span>");
    if (it.pages) meta.push("<span>" + it.pages + "쪽</span>");
    meta.push("<span>" + fmtSize(it.size) + "</span>");
    var href = "viewer.html?f=" + encodeURIComponent(it.path) + "&t=" + encodeURIComponent(it.title);
    var fname = esc(it.title.replace(/[\\\/:*?"<>|]/g, "_")) + ".pdf";
    return '<li><a class="item" href="' + href + '">' +
      '<span class="thumb" aria-hidden="true" data-url="' + esc(it.path) + '" data-key="' + esc(thumbKey(it.path, it.size)) + '"></span>' +
      '<span><span class="item-title">' + highlight(it.title, q) + '</span>' +
      '<span class="item-meta">' + meta.join("") + "</span></span></a>" +
      '<a class="dl-btn" href="' + esc(it.path) + '" download="' + fname + '" aria-label="' + esc(it.title) + ' 다운로드">' + DL + "저장</a></li>";
  }
  function listHtml(items, q, showCat) {
    return '<ul class="list">' + items.map(function (it) { return rowHtml(it, q, showCat); }).join("") + "</ul>";
  }
  function emptyHtml(head, body) { return '<div class="empty"><strong>' + head + "</strong>" + body + "</div>"; }

  function homeView() {
    var counts = {};
    state.items.forEach(function (it) { counts[it.category] = (counts[it.category] || 0) + 1; });
    var html = '<section class="group"><h2>분류<span>' + state.categories.length + "</span></h2><div class=\"cat-grid\">" +
      state.categories.map(function (c) {
        return '<a class="cat-card" href="' + catHref(c) + '">' + BOLT +
          '<span class="cat-name">' + esc(c) + '</span><span class="cat-count">PDF ' + counts[c] + "개</span></a>";
      }).join("") + "</div></section>";
    var fresh = state.items.filter(isNew).sort(function (a, b) { return a.updated < b.updated ? 1 : -1; }).slice(0, RECENT_MAX);
    if (fresh.length) html += '<section class="group"><h2>최근 추가<span>' + fresh.length + "</span></h2>" + listHtml(fresh, "", true) + "</section>";
    return html;
  }

  function categoryView(items) {
    var html = '<a class="crumb" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>전체 분류</a>' +
      '<h2 class="cat-title">' + esc(state.cat) + "<span>" + items.length + "</span></h2>";
    var loose = items.filter(function (it) { return !it.sub; });
    var subs = {}, order = [];
    items.forEach(function (it) { if (it.sub) { if (!subs[it.sub]) { subs[it.sub] = []; order.push(it.sub); } subs[it.sub].push(it); } });
    if (loose.length) html += listHtml(loose, "", false);
    var openAll = order.length === 1 && !loose.length;
    order.forEach(function (s) {
      html += '<details class="sub"' + (openAll ? " open" : "") + "><summary><span>" + esc(s) + "</span><em>" + subs[s].length +
        '</em><svg class="sub-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>' +
        listHtml(subs[s], "", false) + "</details>";
    });
    return html;
  }

  function render() {
    var q = norm(state.q.trim());
    $("q").placeholder = state.cat ? state.cat + " 안에서 찾기" : "자료 이름으로 찾기";

    if (!state.items.length) {
      $("list").innerHTML = emptyHtml("아직 등록된 PDF가 없어요", "pdfs 폴더에 PDF를 넣고<br>build.py를 실행하면 여기에 나타납니다.");
      return;
    }
    var scope = state.cat ? state.items.filter(function (it) { return it.category === state.cat; }) : state.items;

    if (q) { // 검색: 전체(또는 열려 있는 분류) 안에서 평평하게
      var hits = scope.filter(function (it) {
        return norm(it.title).indexOf(q) >= 0 || norm(it.category).indexOf(q) >= 0 || norm(it.sub || "").indexOf(q) >= 0;
      });
      var head = '<h2 class="cat-title">' + (state.cat ? esc(state.cat) + " 검색" : "검색 결과") + "<span>" + hits.length + "</span></h2>";
      $("list").innerHTML = hits.length
        ? head + listHtml(hits, q, true)
        : emptyHtml("찾는 자료가 없어요", "다른 단어로 검색해 보세요." + (state.cat ? ' <br><a class="crumb" href="#">전체 분류에서 찾기</a>' : ""));
    } else if (state.cat) {
      $("list").innerHTML = scope.length ? categoryView(scope) : emptyHtml("이 분류에는 PDF가 없어요", '<a class="crumb" href="#">전체 분류로 돌아가기</a>');
    } else if (state.categories.length < 2) { // 분류가 하나뿐이면 바로 목록
      $("list").innerHTML = listHtml(state.items, "", false);
    } else {
      $("list").innerHTML = homeView();
    }
    hydrateThumbs();
  }

  function syncHash() {
    var m = location.hash.match(/^#cat=(.+)$/), c = "";
    try { c = m ? decodeURIComponent(m[1]) : ""; } catch (e) {}
    state.cat = state.categories.indexOf(c) >= 0 ? c : "";
  }
  window.addEventListener("hashchange", function () { syncHash(); render(); window.scrollTo(0, 0); });

  $("q").addEventListener("input", function () {
    state.q = $("q").value;
    $("clear").hidden = !state.q;
    persist(); render();
  });
  $("clear").addEventListener("click", function () {
    $("q").value = ""; state.q = ""; $("clear").hidden = true;
    persist(); render(); $("q").focus();
  });
  $("q").value = state.q;
  $("clear").hidden = !state.q;

  fetch("manifest.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (m) {
      state.items = m.items || [];
      state.categories = m.categories || [];
      syncHash();
      var n = state.items.length, k = state.categories.length;
      $("count").textContent = n ? "PDF " + n + "개" + (k > 1 ? " · 분류 " + k + "개" : "") : "PDF 자료실";
      $("foot").textContent = (m.generated ? "목록 갱신 " + m.generated + " · " : "") + "화면 v6";
      render();
    })
    .catch(function () {
      $("count").textContent = "PDF 자료실";
      $("list").innerHTML = emptyHtml("목록을 불러오지 못했어요", "manifest.json이 없거나 파일을 직접 열었을 수 있어요. 웹 주소로 접속했는지 확인해 주세요.");
    });
})();
</script>
</body>
</html>
