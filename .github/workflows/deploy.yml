# PDF를 pdfs/ 폴더에 올리면(커밋하면) 자동으로 목록을 다시 만들고 사이트에 반영한다.
name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 파일별 추가 날짜(NEW 표시)를 알기 위해 전체 기록을 받는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf pymupdf
      - name: 목록(manifest.json) 만들기
        run: python3 build.py
      - name: 올릴 파일만 모으기
        run: |
          mkdir -p _site thumbs
          cp -r index.html viewer.html style.css manifest.json site.webmanifest lib assets thumbs pdfs _site/
          sed -i "s/style.css?v=[^\"]*/style.css?v=${GITHUB_SHA::8}/" _site/index.html _site/viewer.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
